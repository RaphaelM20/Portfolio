    <!-- Apply a saved theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (e) {
        /* storage unavailable */
      }
    </script>
